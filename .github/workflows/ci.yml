name: Customer CI and deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:catalog
      - run: npm run typecheck
      - run: npm run build
      - run: python3 -m unittest discover -s scripts/deploy/tests -v
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_PLATFORM: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: env.DEPLOY_PLATFORM == 'linux/arm64'
      - name: Build immutable release image
        run: |
          case "$DEPLOY_PLATFORM" in linux/amd64|linux/arm64) ;; *) exit 1 ;; esac
          image="pdfmaster-web:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --pull --platform "$DEPLOY_PLATFORM" -f Dockerfile -t "$image" .
          python3 scripts/deploy/container_smoke.py web "$image"
      - name: Package main release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/deploy/package.py web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: web-release
          path: release.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  deploy:
    needs: [verify, package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pdfmaster-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check all four deployment secrets
        id: secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: python3 scripts/deploy/check_secrets.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          name: web-release
      - name: Deploy verified release over pinned SSH
        if: steps.secrets.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: python3 scripts/deploy/client.py web
