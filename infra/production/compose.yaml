name: pdfmaster-web
services:
  web:
    image: ${PDFMASTER_IMAGE:?Missing web image}
    environment: {NITRO_HOST: 0.0.0.0, NITRO_PORT: "3000"}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=32m]
    mem_limit: 384m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/en/app').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:4714e0b1b2577eaa1a6131d07c958b67f0eb68e6d0521e90c6e5287db8cf0bc5
    ports: ["127.0.0.1:${PDFMASTER_HTTP_PORT:-8310}:8080"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on: {web: {condition: service_healthy}}
    logging: *logging
